# Temporary. Resolves dependencies with a real Go toolchain, commits go.mod
# and go.sum back to the branch, then builds and tests. It is removed once
# the branch is green.
name: bootstrap

on:
  push:
    branches: [feat/bootstrap-skeleton]

permissions:
  contents: write

concurrency:
  group: bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app?sslmode=disable
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - run: go version

      - name: Resolve dependencies
        run: |
          go get -tool -modfile=tools.mod github.com/pressly/goose/v3/cmd/goose@latest
          go mod edit -droptool github.com/pressly/goose/v3/cmd/goose || true
          go mod tidy

      - name: Commit go.mod and go.sum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum tools.mod tools.sum
          if git diff --cached --quiet; then
            echo "dependencies unchanged"
          else
            git commit -m "Resolve dependencies"
            git push
          fi

      - name: Formatting
        if: always()
        run: gofmt -l -d . | head -200; test -z "$(gofmt -l .)"

      - name: Vet
        if: always()
        run: go vet ./...

      - name: Build
        if: always()
        run: go build ./...

      - name: Migrate
        if: always()
        run: go tool -modfile=tools.mod goose -dir db/migrations postgres "$DATABASE_URL" up

      - name: Test
        if: always()
        run: go test -race ./...

      - name: Smoke
        if: always()
        run: |
          cp .env.example .env
          docker run -d --name pubsub -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --project=local --host-port=0.0.0.0:8085
          make pubsub-setup
          make smoke

      - name: Image
        if: always()
        run: docker build -f deploy/Dockerfile -t go-bootstrap .

      - name: Modernizers
        if: always()
        run: go fix -diff ./... 2>&1 | head -300

      - name: Lint
        if: always()
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
