# Temporary: resolves the new test dependency and checks the branch once
# more before the workflows are removed.
name: verify

on:
  push:
    branches: [feat/bootstrap-skeleton]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve dependencies
        run: |
          go mod tidy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git diff --cached --quiet || (git commit -m "Resolve dependencies" && git push)

      - name: Formatting
        if: always()
        run: gofmt -l -d . | head -200; test -z "$(gofmt -l .)"

      - name: Vet
        if: always()
        run: go vet ./...

      - name: Test
        if: always()
        run: go test -race -count=1 ./...

      - name: Modernizers
        if: always()
        run: go fix -diff ./... 2>&1 | head -300

      - name: Lint
        if: always()
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
